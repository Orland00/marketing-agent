version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "America/Merida"
    open-pull-requests-limit: 2
    labels:
      - "dependencias"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "America/Merida"
    open-pull-requests-limit: 1
    labels:
      - "dependencias"
