name: AI Readiness

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  docs:
    if: github.event.pull_request.draft != true
    concurrency:
      group: 'ai-readiness-${{ github.event.pull_request.number || github.ref }}'
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -s docs/ai/README.md
      - run: test -s docs/ai/agent-topology.md
      - run: test -s docs/ai/prompt-registry.md
      - run: test -s docs/ai/evals/content-quality.jsonl
